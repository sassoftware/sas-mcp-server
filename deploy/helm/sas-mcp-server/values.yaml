# Chart defaults. Anything specific to YOUR environment — endpoint, client
# id, ingress host, TLS secret — belongs in your own values file passed with -f.

replicaCount: 1

image:
  repository: ghcr.io/sassoftware/sas-mcp-server
  # Defaults to .Chart.appVersion when empty. Prefer a digest in production.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# SAS Viya connection
# ---------------------------------------------------------------------------
viya:
  # The Viya environment this server talks to.
  endpoint: https://your-viya-server.com
  # SASLogon OAuth client id. Its registered redirect URI must include
  # <ingress.url>/auth/callback or the browser PKCE flow dead-ends.
  clientId: sas-mcp
  # Matches the application default (verify). Set false ONLY for a self-signed
  # Viya certificate — it disables verification for the whole process, so the
  # OAuth token exchange (carrying the user's authorization code and issued
  # Viya token) also stops verifying. Override it in your own environment
  # values file rather than changing this default.
  sslVerify: true
  computeContextName: SAS Job Execution compute context
  # Set to use a fixed compute session instead of context-backed sessions.
  computeSessionId: ""

# ---------------------------------------------------------------------------
# MCP server behaviour
# ---------------------------------------------------------------------------
server:
  # Advertised to MCP clients during the initialize handshake.
  name: SAS Viya Execution MCP Server
  port: 8134
  # Tool tiers to expose, e.g. "0-4" or "0,1,7". Empty = all 89 tools.
  tiers: ""
  # Expose only tools that neither change server-side state nor cause
  # server-side work (52 of 89). Composes with `tiers`.
  readOnly: false
  # Serve an explanatory HTML page (deployment summary, exposed tiers, client
  # config snippets) to a browser that opens the /mcp URL, instead of the bare
  # 401. Unauthenticated; shows deployment shape only. MCP clients unaffected.
  landingPage: true
  # Accept a raw Viya token as a bearer, alongside the PKCE flow. Lets scripted
  # callers that already hold a Viya token skip the browser dance.
  #
  # KNOW WHAT THIS ACCEPTS: the fallback verifies against
  # JWTVerifier(jwks_uri=..., audience=[]) with no required scopes, so ANY JWT
  # that this Viya's SASLogon signed is a full MCP credential — including one a
  # user minted with `sas-viya auth login` for CLI work, or one issued to an
  # unrelated SASLogon client. There is no client registration and no consent
  # screen on this path. Set false to require the PKCE flow instead.
  allowRawBearer: true
  # Let the server read files off ITS OWN disk as an upload source
  # (upload_file/upload_data `file_path`). Default false here and true in the
  # application, deliberately: in a container the server's disk is the pod, so
  # `file_path` can only read the pod's own filesystem — /proc/self/environ
  # (which holds MCP_SIGNING_KEY), the ServiceAccount token, the OAuth store.
  # It reads any path with no allowlist. Nothing legitimate is lost: `content`,
  # `url` and the upload_inline_data tool all still work, and `file_path` was
  # designed for stdio mode where the server's disk IS the user's machine.
  allowLocalFileUpload: false
  # Bypass SASLogon entirely (only for Viya APIs exposed without auth).
  authEnabled: true

# ---------------------------------------------------------------------------
# Signing key
#
# The server derives its JWT signing key from this deterministically, so all
# replicas sharing it issue compatible tokens.
#
# LEAVING THIS UNSET IS NOT SAFE: the server falls back to the literal string
# "default", which is published in an open-source repo, so anyone can derive
# the key and forge tokens. Either create the secret out of band (recommended)
# or set `signingKey.value`.
#
#   kubectl -n sas-mcp create secret generic sas-mcp-server \
#     --from-literal=signing-key="$(openssl rand -base64 32)"
# ---------------------------------------------------------------------------
signingKey:
  # Reference an existing secret (recommended — keeps the key out of values).
  # Deliberately EMPTY by default: a non-empty default would make the chart's
  # `required` guard and the NOTES warning unreachable, so an install with no
  # secret would look successful and leave the pod in CreateContainerConfigError.
  existingSecret: ""
  existingSecretKey: signing-key
  # Or have the chart create the secret. Mutually exclusive with the above;
  # if set, this wins. Avoid committing a real value.
  value: ""

# ---------------------------------------------------------------------------
# Ingress
#
# The MCP endpoint lands at https://<host><pathPrefix><mcpPath>. The OAuth
# endpoints are NOT all children of it — the server advertises them relative to
# MCP_BASE_URL, and the two .well-known documents live at the HOST ROOT by RFC.
# Every one of the routes the chart renders must reach this Service or the
# browser PKCE flow breaks. Verified against the running app's route table.
#
# `controller` decides WHICH object the chart renders:
#
#   contour  projectcontour.io/v1 HTTPProxy — either delegated from a root
#            proxy that already owns the hostname and its TLS certificate (SAS
#            Viya deploys one, conventionally `sas-httpproxy-root`), or a
#            standalone root proxy that owns the FQDN itself. Contour is the
#            only mode that can mount the server under a path prefix.
#   nginx    networking.k8s.io/v1 Ingress, exactly as chart 0.1.x rendered it.
#
# UPGRADING FROM CHART 0.1.x: the default flipped from nginx to contour. Set
# `ingress.controller: nginx` to keep what you had. The chart fails the render
# when `ingress.className` is set while the controller is not nginx, so an
# nginx values file cannot silently become a Contour deployment.
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  # contour | nginx
  controller: contour
  host: your-viya-server.com
  # Mount the server under a path prefix on `host` instead of at the host root
  # — e.g. "/sas-mcp" puts the MCP endpoint at https://host/sas-mcp/mcp.
  #
  # WHY: it reuses the Viya hostname, its DNS record, its load balancer and its
  # TLS certificate, so no new certificate has to be approved and issued. That
  # is usually the difference between "deployed this week" and "deployed next
  # quarter" in an enterprise.
  #
  # WHAT IT COSTS: the pod still serves /mcp at ITS root, so the prefix has to
  # be rewritten away, and the OAuth discovery URLs do not all move with it
  # (see ingress.contour.rootRelativeOAuth). Contour only — the chart fails the
  # render if this is set with controller=nginx.
  pathPrefix: ""
  # FIXED, not a knob. mcp_server.py does `app = mcp.http_app()` with no path
  # argument, so the app serves /mcp and no env var can move it; pointing the
  # ingress elsewhere would just 404. The chart fails the render rather than
  # let you set a value that silently cannot work.
  mcpPath: /mcp
  # Externally reachable base URL. Normally derived from `host` + `pathPrefix`
  # + TLS; set this only when the ingress is disabled and clients reach the
  # Service some other way (a parent gateway, a port-forward). Never leave it
  # as localhost for a cluster deployment — every OAuth endpoint is advertised
  # relative to it.
  baseUrlOverride: ""
  tls:
    # Ignored in Contour delegated mode: TLS belongs to the root proxy that
    # owns the FQDN, and the chart's children inherit it.
    enabled: true
    secretName: viya-tls-certs
  # Set false if the browser PKCE flow is not needed — e.g. every client passes
  # a Viya token directly with server.allowRawBearer=true. That collapses the
  # routing to the MCP endpoint alone and claims nothing at the host root.
  oauthEnabled: true
  # The OAuth paths the app serves at its own root, used verbatim when
  # pathPrefix is empty. With a pathPrefix set the chart derives the routes
  # instead (the resource-metadata path carries the prefix, the
  # authorization-server one does not) and this list is not used.
  oauthPaths:
    - /.well-known/oauth-protected-resource/mcp
    - /.well-known/oauth-authorization-server
    - /authorize
    - /token
    - /register
    - /consent
    - /auth/callback

  # --- controller: contour ---------------------------------------------------
  contour:
    # Delegate from an existing root HTTPProxy that owns the hostname and its
    # certificate — the normal case on a shared Viya host. Leave `name` empty
    # to have the chart render a STANDALONE root proxy that claims the FQDN
    # itself (only correct when the MCP server owns that hostname; two root
    # proxies for one FQDN is a conflict Contour resolves against you).
    #
    # Helm cannot add the includes to someone else's root proxy, so the chart
    # renders the children and prints the exact `kubectl patch` for the root in
    # NOTES. See deploy/CONTOUR-DEPLOYMENT.md.
    rootProxy:
      name: sas-httpproxy-root
      # Namespace of that root proxy — the Viya namespace, not this one.
      # Required whenever `name` is set; the chart fails the render otherwise,
      # because a child nobody includes is an orphan that routes nothing.
      namespace: ""
    # Also route /.well-known/oauth-authorization-server, /authorize, /token
    # and /register at the HOST ROOT, unprefixed.
    #
    # Only relevant with a pathPrefix. The server advertises those three
    # endpoints WITH the prefix, and a spec-conformant client uses what it is
    # given — but some clients (VS Code, and Claude in some versions) build
    # them as new URL("/authorize", issuer), which drops the issuer's path, and
    # some fetch the authorization-server document from the bare root. Without
    # these routes those clients fail at sign-in.
    #
    # It claims paths at the SHARED host root, so confirm nothing else serves
    # them (Viya's own OAuth is under /SASLogon/oauth/*, so they should be
    # free). Set false if every client you support is conformant.
    rootRelativeOAuth: true
    # MCP streamable HTTP holds long-lived connections and streams responses;
    # Envoy's 15s default response timeout would cut a long SAS execution
    # mid-call. "infinity" disables the response timeout; idle still reaps a
    # connection on which nothing flows in either direction.
    timeoutPolicy:
      response: infinity
      idle: 5m
    # Extra annotations on the rendered HTTPProxy objects.
    annotations: {}

  # --- controller: nginx -----------------------------------------------------
  # Deliberately EMPTY rather than "nginx": a non-empty default would let a
  # 0.1.x values file that names an ingress class render as Contour without a
  # word. Setting it is what tells the chart you mean nginx.
  className: ""
  annotations:
    # MCP streamable HTTP holds long-lived connections and streams responses.
    # nginx's 60s default read timeout would cut a long SAS execution mid-call;
    # buffering would stall streamed output until the response completed.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # upload_file / upload_data send file bodies through this path.
    nginx.ingress.kubernetes.io/proxy-body-size: 100m

service:
  type: ClusterIP
  port: 8134
  annotations: {}

# ---------------------------------------------------------------------------
# Persistence for OAuth client registrations
#
# FastMCP stores dynamically registered OAuth clients as a Fernet-encrypted
# file tree under this path. With emptyDir they are lost on every restart and
# clients must re-register; a PVC keeps them. A volume of some kind is REQUIRED
# whenever readOnlyRootFilesystem is true — OAuthProxy mkdirs the directory at
# import time, so without one the container crash-loops at startup. The chart
# fails the render on that combination rather than let you find out live.
# ---------------------------------------------------------------------------
persistence:
  enabled: true
  mountPath: /app/.local/share/fastmcp
  # emptyDir | pvc
  type: emptyDir
  pvc:
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# ---------------------------------------------------------------------------
# Opt-in usage telemetry (default OFF).
#
# PRIVACY — READ BEFORE ENABLING ON A SHARED DEPLOYMENT. This records the tool
# INPUTS (the SAS code and queries submitted) and the model's stated goal, for
# EVERY user of this server, not just you. On a laptop that is self-consent; on
# a shared server it is collecting other people's work. Redaction is heuristic
# (credential-shaped keys, Bearer/JWT, the Viya hostname) and does NOT detect
# PII in data values. Tell your users before turning this on.
#
# The log is a file, so it needs the volume below. It is per-pod and not
# coordinated across processes — one path per pod.
# ---------------------------------------------------------------------------
telemetry:
  enabled: false
  logPath: /var/log/sas-mcp/tool-usage.log
  # never | failures | always. "failures" records full (capped, redacted)
  # result bodies ONLY for calls that errored or whose tool declared a failure —
  # the highest-value trace data and the least likely to carry table rows.
  #
  # Needs schema v3 (image 1.9.0+, which this chart now defaults to). If you
  # PIN image.tag to 1.8.0 or older, that build parses this with env_bool —
  # true/1/yes/on and false/0/no/off only — and silently falls back to its
  # default for anything else, so "failures" would quietly mean shape-only.
  # "true"/"false" mean the same thing on every build.
  logResults: "failures"
  requireGoal: true
  # Telemetry writes to a file; give it somewhere writable.
  persistence:
    type: emptyDir
    pvc:
      size: 2Gi
      storageClass: ""

# Memory is the binding constraint, and it is driven by transient result buffers
# rather than by user count — 40 concurrent clients cost only ~23Mi over a 152Mi
# idle baseline. The limit is sized for MAX_EXPORT_INLINE_BYTES (25 MiB), which
# export_report returns inline, then base64-encodes (x1.33) and JSON-serializes;
# at 512Mi that left ~360Mi of headroom and one large export could OOM the pod.
# An OOM is SIGKILL, so the lifespan never runs and every warm compute session
# leaks. See SCALING.md.
#
# Deliberately NO CPU limit: the workload is bursty and single-threaded, so a
# limit throttles the event loop and inflates tail latency. Requests alone give
# it scheduling priority without a ceiling.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# The lifespan issues one DELETE per warm compute session on shutdown; allow
# time for that rather than leaking sessions on every rollout.
terminationGracePeriodSeconds: 60

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100 # `sas` in the published image
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: ""
  annotations: {}

livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Extra environment variables, e.g. [{name: FOO, value: "bar"}]
extraEnv: []
