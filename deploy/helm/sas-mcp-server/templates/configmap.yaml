apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sas-mcp-server.fullname" . }}
  labels:
    {{- include "sas-mcp-server.labels" . | nindent 4 }}
data:
  VIYA_ENDPOINT: {{ .Values.viya.endpoint | quote }}
  # MUST be externally reachable — the server advertises its OAuth endpoints
  # relative to this.
  MCP_BASE_URL: {{ include "sas-mcp-server.baseUrl" . | quote }}
  CLIENT_ID: {{ .Values.viya.clientId | quote }}
  SSL_VERIFY: {{ .Values.viya.sslVerify | quote }}
  HOST_PORT: {{ .Values.server.port | quote }}
  COMPUTE_CONTEXT_NAME: {{ .Values.viya.computeContextName | quote }}
  MCP_SERVER_NAME: {{ .Values.server.name | quote }}
  ALLOW_RAW_BEARER: {{ .Values.server.allowRawBearer | quote }}
  ALLOW_LOCAL_FILE_UPLOAD: {{ .Values.server.allowLocalFileUpload | quote }}
  VIYA_AUTH: {{ .Values.server.authEnabled | quote }}
  MCP_READ_ONLY: {{ .Values.server.readOnly | quote }}
  MCP_LANDING_PAGE: {{ .Values.server.landingPage | quote }}
  MCP_APPS: {{ .Values.server.apps | quote }}
  MCP_STATELESS_HTTP: {{ .Values.server.statelessHttp | quote }}
  MCP_OAUTH_CLIENT_SECRETS: {{ .Values.server.oauthClientSecrets | quote }}
  VIYA_CLIENT_TIMEOUT: {{ .Values.server.clientTimeout | quote }}
  {{- with .Values.server.defaultFolder }}
  MCP_DEFAULT_FOLDER: {{ . | quote }}
  {{- end }}
  {{- with .Values.server.defaultPublishDestination }}
  MCP_DEFAULT_PUBLISH_DESTINATION: {{ . | quote }}
  {{- end }}
  {{- with .Values.server.defaultModelRepository }}
  MCP_DEFAULT_MODEL_REPOSITORY: {{ . | quote }}
  {{- end }}
  {{- /* toString, NOT `with`: Go templates treat the integer 0 as false, so
         `--set server.tiers=0` would drop this key entirely and the server
         would fall back to registering EVERY tier. */}}
  {{- $tiers := .Values.server.tiers | toString }}
  {{- if ne $tiers "" }}
  MCP_TIERS: {{ $tiers | quote }}
  {{- end }}
  {{- with .Values.server.toolRename }}
  MCP_TOOL_RENAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.viya.computeSessionId }}
  COMPUTE_SESSION_ID: {{ . | quote }}
  {{- end }}
  {{- if .Values.telemetry.enabled }}
  COLLECTION_MODE: "true"
  COLLECTION_LOG_PATH: {{ .Values.telemetry.logPath | quote }}
  COLLECTION_LOG_RESULTS: {{ .Values.telemetry.logResults | quote }}
  COLLECTION_REQUIRE_GOAL: {{ .Values.telemetry.requireGoal | quote }}
  {{- end }}
