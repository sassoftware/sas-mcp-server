# SAS Viya MCP Server — sample Kubernetes deployment
#
# Serves the MCP endpoint at https://your-viya-server.com/mcp
#
# BEFORE APPLYING, do these three things — each is a hard requirement:
#
#   1. Create the signing-key secret (NEVER commit the value):
#        kubectl -n sas-mcp create secret generic sas-mcp-server \
#          --from-literal=signing-key="$(openssl rand -base64 32)"
#      The server derives its JWT signing key from this deterministically, so
#      every replica sharing it issues compatible tokens. Leaving it unset makes
#      the server fall back to the literal string "default" — a publicly known
#      value in an open-source repo, i.e. forgeable tokens.
#
#   2. Register the OAuth redirect URI in SASLogon for client `sas-mcp`:
#        https://your-viya-server.com/auth/callback
#      The browser PKCE flow dead-ends without it.
#
#   3. Confirm nothing else on this host already serves /authorize, /token,
#      /register, /consent or /auth/callback:
#        kubectl get ingress -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"\t"}{.metadata.name}{"\t"}{.spec.rules[*].http.paths[*].path}{"\n"}{end}'
#      Viya's own OAuth lives under /SASLogon/oauth/*, so these should be free —
#      but this is a shared host, so verify rather than assume.
#
# Routed by ingress-nginx, at the host root. For Contour — and for mounting the
# server under a path prefix on the Viya hostname, which reuses its certificate —
# use sas-mcp-server-contour.yaml instead; see ../CONTOUR-DEPLOYMENT.md.
#
# Apply with:  kubectl apply -f sas-mcp-server.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sas-mcp-server
  namespace: sas-mcp
data:
  VIYA_ENDPOINT: https://your-viya-server.com
  # MUST be the externally reachable URL. The server advertises its OAuth
  # endpoints relative to this, so a wrong value sends clients somewhere that
  # does not exist. No trailing path: the MCP app mounts at /mcp itself.
  MCP_BASE_URL: https://your-viya-server.com
  # Self-signed Viya certificate (matches SSL_VERIFY=false in the local .env).
  SSL_VERIFY: "false"
  CLIENT_ID: sas-mcp
  HOST_PORT: "8134"
  COMPUTE_CONTEXT_NAME: SAS Job Execution compute context
  MCP_SERVER_NAME: SAS Viya Execution MCP Server
  # Accept a Viya token passed straight through as a bearer, alongside the PKCE
  # flow. Useful for scripted callers that already hold a Viya token.
  # NOTE what this accepts: the fallback verifier sets audience=[] with no
  # required scopes, so ANY JWT this Viya's SASLogon signed works as a full MCP
  # credential — including tokens minted for other clients. Set "false" to
  # require the PKCE flow.
  ALLOW_RAW_BEARER: "true"
  # Refuse to read files off the server's own disk as an upload source.
  # The application defaults this to TRUE; in a container that is a liability,
  # because the server's disk is the pod — `file_path` would read
  # /proc/self/environ (which holds MCP_SIGNING_KEY), the ServiceAccount token,
  # or the OAuth store, with no allowlist. Nothing legitimate is lost: the
  # `content` and `url` sources and upload_inline_data all still work.
  ALLOW_LOCAL_FILE_UPLOAD: "false"
  # Uncomment to narrow the exposed surface:
  # MCP_TIERS: "0-4"
  # MCP_READ_ONLY: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sas-mcp-server
  namespace: sas-mcp
# The server calls Viya over HTTPS and never touches the Kubernetes API. An API
# token on disk is readable by anything that can read a path, so do not mount one.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sas-mcp-server
  namespace: sas-mcp
  labels:
    app: sas-mcp-server
spec:
  # Keep at 1. Two things break at >1 and neither is fixable in this file:
  #   * OAuth client registrations live in a per-pod file-tree store, so a client
  #     registered on pod A is unknown to pod B.
  #   * Warm Viya compute sessions are cached in-process, so the same user
  #     hitting a different pod spins up a second session on Viya.
  replicas: 1
  strategy:
    type: Recreate # the state volume below is RWO; avoid two pods holding it
  selector:
    matchLabels:
      app: sas-mcp-server
  template:
    metadata:
      labels:
        app: sas-mcp-server
    spec:
      serviceAccountName: sas-mcp-server
      automountServiceAccountToken: false
      # The lifespan issues one DELETE per warm compute session on shutdown;
      # allow time for that rather than leaking sessions on every rollout.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 100 # `sas` in the published image
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sas-mcp-server
          image: ghcr.io/sassoftware/sas-mcp-server:1.14.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8134
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sas-mcp-server
          env:
            - name: MCP_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: sas-mcp-server
                  key: signing-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # OAuth client registrations (a Fernet-encrypted file tree).
            # REQUIRED under readOnlyRootFilesystem: OAuthProxy mkdirs this
            # directory at import time, so without it the container crash-loops
            # at startup — it does not start healthy and fail later.
            - name: fastmcp-state
              mountPath: /app/.local/share/fastmcp
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Sized for MAX_EXPORT_INLINE_BYTES (25 MiB): export_report returns
          # that inline, base64-encoded (x1.33) and JSON-serialized on top, so
          # one large export can transiently need several hundred MiB against a
          # 152Mi idle baseline. An OOM is SIGKILL, so the lifespan never runs
          # and every warm compute session leaks. No CPU limit on purpose — the
          # workload is bursty and single-threaded, and a limit throttles the
          # event loop. See SCALING.md.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        # emptyDir keeps registrations only for the pod's lifetime; swap for a
        # PVC to survive restarts without forcing clients to re-register.
        - name: fastmcp-state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sas-mcp-server
  namespace: sas-mcp
spec:
  type: ClusterIP
  selector:
    app: sas-mcp-server
  ports:
    - name: http
      port: 8134
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sas-mcp-server
  namespace: sas-mcp
  annotations:
    # MCP streamable HTTP holds long-lived connections and streams responses.
    # nginx's 60s default read timeout would cut a long SAS execution mid-call,
    # and its default buffering would stall streamed output until completion.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # upload_file / upload_data send file bodies through this path.
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  rules:
    - host: your-viya-server.com
      http:
        paths:
          # The MCP endpoint itself. No rewrite: the app serves /mcp natively,
          # so the path is forwarded unchanged.
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: sas-mcp-server
                port:
                  name: http
          # --- OAuth 2.0 endpoints -------------------------------------------
          # These are siblings of /mcp at the app root, not children of it, and
          # the paths are fixed by the library. Verified by enumerating the
          # running app's routes. The server advertises exactly these URLs in
          # its discovery documents, so all of them must reach this service or
          # the browser PKCE flow breaks.
          - path: /.well-known/oauth-protected-resource/mcp
            pathType: Prefix
            backend:
              service:
                name: sas-mcp-server
                port:
                  name: http
          - path: /.well-known/oauth-authorization-server
            pathType: Prefix
            backend:
              service:
                name: sas-mcp-server
                port:
                  name: http
          - path: /authorize
            pathType: Prefix
            backend:
              service:
                name: sas-mcp-server
                port:
                  name: http
          - path: /token
            pathType: Prefix
            backend:
              service:
                name: sas-mcp-server
                port:
                  name: http
          - path: /register
            pathType: Prefix
            backend:
              service:
                name: sas-mcp-server
                port:
                  name: http
          - path: /consent
            pathType: Prefix
            backend:
              service:
                name: sas-mcp-server
                port:
                  name: http
          - path: /auth/callback
            pathType: Prefix
            backend:
              service:
                name: sas-mcp-server
                port:
                  name: http
  tls:
    - hosts:
        - your-viya-server.com
      secretName: viya-tls-certs
